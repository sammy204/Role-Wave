<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/rolewave-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>RoleWave | Verified jobs in Nigeria</title>
    <meta name="description" content="Find your perfect role with verified job listings and trusted companies." />
    <link rel="canonical" href="https://rolewave.cv/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RoleWave" />
    <meta property="og:title" content="RoleWave | Verified jobs in Nigeria" />
    <meta property="og:description" content="Find your perfect role with verified job listings and trusted companies." />
    <meta property="og:url" content="https://rolewave.cv/" />
    <meta property="og:image" content="https://rolewave.cv/rolewave-og.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="RoleWave | Verified jobs in Nigeria" />
    <meta property="twitter:description" content="Find your perfect role with verified job listings and trusted companies." />
    <meta property="twitter:image" content="https://rolewave.cv/rolewave-og.svg" />
    <meta name="theme-color" content="#1D9E75" />
    <script>
      try {
        const preference = localStorage.getItem('rolewave-theme');
        const followsDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = preference === 'dark' || (preference === 'system' && followsDark) ? 'dark' : 'light';
      } catch (_) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
